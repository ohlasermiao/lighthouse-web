# 依赖漏洞自动监控（安全问卷 #4「定期脆弱性诊断」制度化的一环）
# 背景与季度扫描 SOP 见 ../sync-value/docs/security-plan.md §3.1
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "dependencies"
  # ⚠️ 2026-08-06 撤掉 github-actions 生态：本仓**根本没有 workflow**
  #    （无 /action.yml、无 .github/workflows/*.yml），Dependabot 每周照跑照失败：
  #    `Error during file fetching; aborting: /action.yml or /.github/workflows/<anything>.yml not found`
  #    从 2026-07-23 起每周红一次，红了没人看 —— 红灯天天亮就等于没有红灯。
  #    哪天真加了 workflow，再把这段加回来。npm 那一条是真的在跑，保留。
